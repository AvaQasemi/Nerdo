<!doctype html>
<html lang="fa">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>ورود | نِردو</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>
	<div class="auth-wrap">
		<div class="card auth-card">
			<div class="center">
				<h2>ورود به نِردو</h2>
				<p class="muted">نام کاربری و رمز را وارد کن.</p>
			</div>
			<div class="hr"></div>

			<form id="loginForm">
				<label class="lbl">نام کاربری (ایمیل یا هر چیز)</label>
				<input name="username" required placeholder="مثلاً ava@gmail.com">

				<label class="lbl">رمز عبور</label>
				<input name="password" type="password" required placeholder="****">

				<button class="primary" type="submit" style="margin-top:12px;width:100%">ورود</button>
			</form>

			<div id="msg" class="msg"></div>

			<div class="hr"></div>
			<div class="topbar-actions" style="justify-content:center">
				<a class="tag" href="/register.html">ثبت‌نام</a>
				<a class="tag" href="/index.html">خانه</a>
			</div>
		</div>
	</div>

	<script src="/js/auth.js"></script>
</body>

</html>
