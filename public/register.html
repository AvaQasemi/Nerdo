<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ثبت‌نام | نِردو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="center">
        <h2>ثبت‌نام در نِردو</h2>
        <p class="muted">یه نِردِ جدید بساز 😄</p>
      </div>
      <div class="hr"></div>

      <form id="registerForm">
        <label class="lbl">نام نمایشی</label>
        <input name="name" required placeholder="مثلاً آوا">

        <label class="lbl">نام کاربری</label>
        <input name="username" required placeholder="مثلاً ava@gmail.com">

        <label class="lbl">رمز عبور</label>
        <input name="password" type="password" required placeholder="حداقل ۴ کاراکتر">

        <button class="primary" type="submit" style="margin-top:12px;width:100%">ثبت‌نام</button>
      </form>

      <div id="msg" class="msg"></div>

      <div class="hr"></div>
      <div class="topbar-actions" style="justify-content:center">
        <a class="tag" href="/login.html">ورود</a>
        <a class="tag" href="/index.html">خانه</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
