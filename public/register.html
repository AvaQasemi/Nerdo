<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width,initial-scale=1"/>
	<title>ثبت‌نام | نردو</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;900&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="container" style="max-width:540px">
		<div class="card">
			<div class="brand" style="justify-content:center">
				<!-- لوگوی 🤓 -->
				<svg class="logo" viewBox="0 0 120 120" aria-label="لوگوی نردو">
					<circle cx="60" cy="60" r="52" fill="#fde68a"/>
					<circle cx="45" cy="55" r="8" fill="#111"/>
					<circle cx="75" cy="55" r="8" fill="#111"/>
					<rect x="28" y="40" width="64" height="30" rx="12" fill="none" stroke="#111" stroke-width="6"/>
					<path d="M40 80 Q60 95 80 80" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
				</svg>
				<div>
					<h1>ثبت‌نام</h1>
					<div class="sub">یک نِرد جدید بساز 😄</div>
				</div>
			</div>

			<div class="hr"></div>
<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
	<button id="themeToggle" class="ghost">🌙 دارک</button>
</div>
			<!-- فرم ثبت‌نام -->
			<form id="registerForm">
				<label class="lbl">نام</label>
				<input name="name" required placeholder="مثلاً آوا">

				<label class="lbl">نام کاربری</label>
				<input name="username" required placeholder="مثلاً ava">

				<label class="lbl">رمز عبور</label>
				<input name="password" type="password" required placeholder="حداقل ۴ کاراکتر">

				<button class="primary" type="submit" style="width:100%;margin-top:12px">ساخت حساب</button>
			</form>

			<div id="msg" class="empty" style="display:none;margin-top:10px"></div>

			<div class="hr"></div>
			<div class="topbar-actions" style="justify-content:center">
				<a class="tag" href="/login.html">ورود</a>
				<a class="tag" href="/">خانه</a>
			</div>
		</div>
	</div>

	<script type="module" src="/js/auth.js"></script>
	<script src="/js/theme.js"></script>
</body>
</html>
