<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width,initial-scale=1"/>
	<title>پروفایل | نردو</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;900&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="container">
		<div class="topbar">
			<div class="brand">
				<!-- لوگوی 🤓 -->
				<svg class="logo" viewBox="0 0 120 120" aria-label="لوگوی نردو">
					<circle cx="60" cy="60" r="52" fill="#fde68a"/>
					<circle cx="45" cy="55" r="8" fill="#111"/>
					<circle cx="75" cy="55" r="8" fill="#111"/>
					<rect x="28" y="40" width="64" height="30" rx="12" fill="none" stroke="#111" stroke-width="6"/>
					<path d="M40 80 Q60 95 80 80" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
				</svg>
				<div>
					<h1>پروفایل</h1>
					<div id="meName" class="sub"></div>
				</div>
			</div>

			<div class="topbar-actions">
				<a class="tag" href="/dashboard.html">بازگشت</a>
			</div>
		</div>

		<div class="grid">
			<div class="card">
				<h2>خلاصه</h2>
				<div class="hr"></div>

				<div class="kpi-grid">
					<div class="kpi"><div id="pProjects" class="n">0</div><div class="t">تعداد پروژه‌ها</div></div>
					<div class="kpi"><div id="pDone" class="n">0</div><div class="t">انجام شده</div></div>
					<div class="kpi"><div id="pTotal" class="n">0</div><div class="t">کل تسک‌ها</div></div>
					<div class="kpi"><div id="pRate" class="n">0%</div><div class="t">نرخ تکمیل کلی</div></div>
				</div>
			</div>

			<div class="card">
				<h2>آمار هر پروژه</h2>
				<p class="muted">برای هر پروژه نوار پیشرفت جدا نمایش داده می‌شود.</p>
				<div class="hr"></div>

				<div id="projectStats"></div>
				<div id="emptyProfile" class="empty" style="display:none">
					هنوز پروژه‌ای نداری 🙂 از داشبورد یک پروژه بساز.
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="/js/profile.js"></script>
	<script src="/js/theme.js"></script>
</body>
</html>
